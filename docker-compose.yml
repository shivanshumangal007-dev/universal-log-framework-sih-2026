services:
 clickhouse:
  image: clickhouse/clickhouse-server:24.11
  container_name: ch-server
  restart: unless-stopped
  ports:
   - "8123:8123" # HTTP interface
   - "9000:9000" # native client
  environment:
   CLICKHOUSE_DB: logs
   CLICKHOUSE_USER: default
   CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
  volumes:
   - ./infra/ch_data:/var/lib/clickhouse/
   - ./infra/ch_logs:/var/log/clickhouse-server/
  ulimits:
   nofile:
    soft: 262144
    hard: 262144
  healthcheck:
   test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
   interval: 10s
   timeout: 5s
   retries: 5
   start_period: 10s
  networks:
   - log-network

 kafka:
  image: apache/kafka:3.9.0
  container_name: kafka
  restart: unless-stopped
  ports:
   - "9092:9092"
  environment:
   KAFKA_NODE_ID: 1
   KAFKA_PROCESS_ROLES: broker,controller
   KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
   KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
   KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
   KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
   KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
   KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
   KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
   KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
   KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
  volumes:
   - ./infra/kafka_data:/var/lib/kafka/data
  healthcheck:
   test:
    [
     "CMD-SHELL",
     "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1",
    ]
   interval: 10s
   timeout: 5s
   retries: 5
   start_period: 20s
  networks:
   - log-network

 collector:
  build:
   context: ./ingestion
   dockerfile: deployments/Dockerfile.collector
  container_name: log-collector
  restart: unless-stopped
  environment:
   - KAFKA_BROKERS=kafka:9092
   - KAFKA_RAW_TOPIC=raw-logs
   - KAFKA_PARSED_TOPIC=parsed-logs
   - SYSLOG_BIND=0.0.0.0:514
   - FILETAIL_PATHS=/var/log/test.log,/var/log/test1.log
  ports:
   - "514:514/udp"
  volumes:
   - ./ingestion/configs:/var/log
  depends_on:
   kafka:
    condition: service_healthy
  networks:
   - log-network

 parser:
  build:
   context: ./ingestion
   dockerfile: deployments/Dockerfile.parser
  restart: unless-stopped
  # NOTE: container_name removed on purpose — it's incompatible with
  # deploy.replicas > 1 (compose needs to generate unique names per
  # replica). Docker will refuse to scale, or silently run just one
  # instance, if a fixed container_name is set here.
  environment:
   - KAFKA_BROKERS=kafka:9092
   - KAFKA_RAW_TOPIC=raw-logs
   - KAFKA_PARSED_TOPIC=parsed-logs
   - KAFKA_GROUP_ID=log-parser-group
  depends_on:
   kafka:
    condition: service_healthy
   collector:
    condition: service_started
  networks:
   - log-network
  deploy:
   replicas: 2

 sink:
  build:
   context: ./ingestion
   dockerfile: deployments/Dockerfile.sink
  container_name: log-sink
  restart: unless-stopped
  env_file:
   - .env
  environment:
   - KAFKA_BROKERS=kafka:9092
   - KAFKA_PARSED_TOPIC=parsed-logs
   - KAFKA_SINK_GROUP_ID=clickhouse-sink
   - CLICKHOUSE_ADDR=ch-server:9000
   - CLICKHOUSE_DATABASE=logs
   - CLICKHOUSE_USERNAME=default
  depends_on:
   kafka:
    condition: service_healthy
   clickhouse:
    condition: service_healthy
   parser:
    condition: service_started
  networks:
   - log-network

 inferredsink:
  build:
   context: ./ingestion
   dockerfile: deployments/Dockerfile.inferredsink
  container_name: log-inferred-sink
  restart: unless-stopped
  env_file:
   - .env
  environment:
   - KAFKA_BROKERS=kafka:9092
   - KAFKA_INFERRED_TOPIC=inferred-logs
   - CLICKHOUSE_ADDR=ch-server:9000
   - CLICKHOUSE_DATABASE=logs
   - CLICKHOUSE_USERNAME=default
  depends_on:
   kafka:
    condition: service_healthy
   clickhouse:
    condition: service_healthy
  networks:
   - log-network

 inference:
  build:
   context: ./inference
   dockerfile: Dockerfile
  container_name: log-inference
  restart: unless-stopped
  ports:
   - "8000:8000"
  env_file:
   - .env
  environment:
   - KAFKA_BROKERS=kafka:9092
   - KAFKA_UNKNOWN_TOPIC=unknown-logs
   - KAFKA_INFERRED_TOPIC=inferred-logs
   - KAFKA_GROUP_ID=inference-engine
   - CLICKHOUSE_URL=http://ch-server:8123
   - CLICKHOUSE_USER=default
   - CLICKHOUSE_DATABASE=logs
   - DASHBOARD_ORIGIN=http://localhost:3000
  depends_on:
   kafka:
    condition: service_healthy
   clickhouse:
    condition: service_healthy
  networks:
   - log-network

 dashboard:
  build:
   context: ./dashboard
   dockerfile: Dockerfile
  container_name: log-dashboard
  restart: unless-stopped
  ports:
   - "3000:80"
  depends_on:
   - inference
  networks:
   - log-network

networks:
 log-network:
  driver: bridge
